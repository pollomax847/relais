# Relais : conversion, bibliothèque d'activités, santé, envois et sauvegarde de la montre (http://localhost:8090)
services:
  relais:
    container_name: relais
    build:
      context: ../outils
      args:  # chemins de l'ordinateur, définis dans .env (voir .env.example)
        SPORT_HOME: ${SPORT_HOME}
        SPORT_PROJET: ${SPORT_PROJET}
    environment:
      - SPORT_AUTO_HEURE=04:00  # « non » pour suspendre ; sans SPORT_AUTO_DESTINATIONS (sport.env), aucune activité envoyée
      - TZ=Europe/Paris
    # Les dossiers sont montés au même chemin que sur l'ordinateur : les chemins des index et journaux restent valables
    volumes:
      - ${SPORT_PROJET}:${SPORT_PROJET}
      - ${SPORT_HOME}/.config/sport:${SPORT_HOME}/.config/sport  # clés des services, jetons Garmin
      - ${SPORT_HOME}/projects:${SPORT_HOME}/projects:ro  # zepp-fit-files, zepp-data
      # disques USB et montre Garmin, y compris ceux branchés après le démarrage (rslave)
      - type: bind
        source: ${SPORT_MEDIA}
        target: ${SPORT_MEDIA}
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
